<style>
    /* CSS BẢNG XẾP HẠNG HIỆN ĐẠI & MOBILE RESPONSIVE */
    .leaderboard-card { padding: 30px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 25px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
    .leaderboard-header { color: #d97706; margin-top: 0; margin-bottom: 10px; border-bottom: 2px solid #fef3c7; padding-bottom: 15px; font-weight: 800; font-size: 1.3rem; display: flex; align-items: center; gap: 10px;}
    
    /* BỤC VINH QUANG TOP 3 */
    .podium-container { display: flex; justify-content: center; align-items: flex-end; gap: 18px; margin-bottom: 30px; padding-top: 35px; }
    .podium-step { position: relative; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%); border-radius: 16px 16px 0 0; padding: 20px 10px 0; width: 145px; box-shadow: 0 -4px 15px rgba(0,0,0,0.04); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .podium-step:hover { transform: translateY(-8px); }
    .podium-avatar { width: 75px; height: 75px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 6px 15px rgba(0,0,0,0.1); margin-bottom: 12px; background: #fff; z-index: 2; }
    .crown-icon { position: absolute; top: -28px; font-size: 2.2rem; color: #fbbf24; filter: drop-shadow(0 4px 6px rgba(251, 191, 36, 0.4)); animation: floatCrown 2.5s infinite ease-in-out; z-index: 3;}
    .podium-name { font-weight: 700; font-size: 0.95rem; color: #1e293b; text-align: center; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
    .podium-xp { font-size: 0.85rem; color: #475569; font-weight: 800; margin-bottom: 15px; background: #e2e8f0; padding: 4px 12px; border-radius: 12px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);}
    .podium-rank-box { width: 100%; text-align: center; padding: 12px 0; font-size: 1.2rem; font-weight: 800; color: white; margin-top: auto; border-radius: 0; letter-spacing: 0.5px;}
    
    .step-1 { height: 260px; z-index: 3; border: 2px solid #fbbf24; border-bottom: none; background: linear-gradient(180deg, #fffbeb 0%, #fef3c7 100%); }
    .step-1 .podium-rank-box { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    .step-1 .podium-avatar { border-color: #fbbf24; width: 95px; height: 95px; margin-bottom: 15px;}
    
    .step-2 { height: 215px; z-index: 2; border: 2px solid #cbd5e1; border-bottom: none; }
    .step-2 .podium-rank-box { background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%); }
    
    .step-3 { height: 185px; z-index: 1; border: 2px solid #fcd34d; border-bottom: none; }
    .step-3 .podium-rank-box { background: linear-gradient(135deg, #d97706 0%, #b45309 100%); }

    /* THÀNH TÍCH CÁ NHÂN (GỌN GÀNG TÍCH HỢP BÊN TRONG CARD) */
    .compact-personal-rank { display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, #0056b3 0%, #084298 100%); color: white; padding: 16px 24px; border-radius: 14px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(8, 66, 152, 0.2); }
    .c-rank-info { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.05rem; }
    .c-rank-stats { display: flex; align-items: center; gap: 15px; }
    .xp-badge { font-size: 0.95rem; }
    .xp-badge b { color: #fbbf24; font-size: 1.1rem; }
    .rank-badge { background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 0.95rem; backdrop-filter: blur(4px);}
    .out-of-rank { background: rgba(255,255,255,0.1); color: #cbd5e1; }

    /* DANH SÁCH TOP PHÂN TRANG */
    .modern-leaderboard-list { display: flex; flex-direction: column; gap: 12px; min-height: 400px; }
    .leaderboard-row { display: flex; align-items: center; padding: 14px 24px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; transition: all 0.2s ease; cursor: default;}
    .leaderboard-row:hover { transform: translateX(6px); box-shadow: 0 4px 15px rgba(0,0,0,0.06); border-color: #bfdbfe; background: #f8fafc; }
    .row-rank { font-size: 1.25rem; font-weight: 800; color: #94a3b8; width: 60px; flex-shrink: 0; }
    .row-info { display: flex; align-items: center; gap: 18px; flex: 1; overflow: hidden; }
    .row-avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid #f1f5f9; background: #e2e8f0; }
    .row-name { font-weight: 700; color: #1e293b; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-xp { font-weight: 800; color: #0284c7; font-size: 1.1rem; flex-shrink: 0; background: #f0f9ff; padding: 8px 16px; border-radius: 10px; border: 1px solid #bae6fd; }

    /* NÚT PHÂN TRANG */
    .pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 30px; }
    .page-btn { background: #f8fafc; border: 1px solid #cbd5e1; color: #334155; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
    .page-btn:hover:not(:disabled) { background: #e2e8f0; color: #0f172a; border-color: #94a3b8; }
    .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .page-indicator { font-weight: 600; color: #475569; font-size: 0.95rem; }

    /* XÓA BỎ THANH STICKY CŨ (NẾU CÒN TRONG FILE GỐC) */
    #stickyUserRank { display: none !important; }

    @keyframes floatCrown { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    /* TỐI ƯU SIÊU MƯỢT CHO ĐIỆN THOẠI (MOBILE RESPONSIVE) */
    @media (max-width: 768px) {
        .leaderboard-card { padding: 15px; border-radius: 12px; }
        .leaderboard-header { font-size: 1.15rem; margin-bottom: 0; padding-bottom: 10px;}
        
        .podium-container { gap: 6px; align-items: flex-end; padding-top: 25px; margin-bottom: 25px;}
        .podium-step { width: 32%; padding: 15px 4px 0; border-width: 1px; border-radius: 12px 12px 0 0;}
        .step-1 { height: 200px; }  .step-2 { height: 165px; }  .step-3 { height: 140px; }
        .podium-avatar { width: 46px; height: 46px; border-width: 2px; margin-bottom: 8px; }
        .step-1 .podium-avatar { width: 60px; height: 60px; margin-bottom: 10px;}
        .crown-icon { font-size: 1.5rem; top: -20px; }
        .podium-name { font-size: 0.75rem; margin-bottom: 4px; }
        .podium-xp { font-size: 0.75rem; padding: 2px 6px; margin-bottom: 10px; font-weight: 700;}
        .podium-rank-box { font-size: 0.95rem; padding: 8px 0; }
        
        .compact-personal-rank { flex-direction: column; gap: 12px; padding: 15px; text-align: center; }
        .c-rank-stats { width: 100%; justify-content: space-around; }
        .xp-badge { font-size: 0.85rem; } .xp-badge b { font-size: 1rem; }
        .rank-badge { font-size: 0.85rem; padding: 4px 10px; }

        .modern-leaderboard-list { gap: 8px; min-height: 250px; }
        .leaderboard-row { padding: 12px 15px; border-radius: 10px; }
        .row-rank { width: 40px; font-size: 1.1rem; }
        .row-info { gap: 12px; }
        .row-avatar { width: 38px; height: 38px; border-width: 1px;}
        .row-name { font-size: 0.95rem; }
        .row-xp { font-size: 0.95rem; padding: 6px 12px; }
    }
</style>

<div class="card leaderboard-card">
    <h3 class="leaderboard-header"><i class="fa-solid fa-trophy"></i> Bảng Xếp Hạng Vinh Quang</h3>
    
    <!-- KHỐI GIẢI THÍCH LOGIC TÍNH HẠNG -->
    <div style="background-color: #f0f9ff; border: 1px solid #bae6fd; padding: 12px 18px; border-radius: 10px; margin-bottom: 25px; font-size: 0.95rem; color: #0369a1; display: flex; align-items: flex-start; gap: 10px; line-height: 1.5;">
        <i class="fa-solid fa-circle-info" style="margin-top: 3px; font-size: 1.1rem;"></i>
        <div><b>Cách tính thứ hạng:</b> Vị trí trên bảng xếp hạng được quyết định bởi <b>Tổng số XP</b> (Điểm kinh nghiệm) mà bạn tích lũy được sau mỗi lần hoàn thành bài thi. Hãy chăm chỉ luyện tập để leo lên Top nhé!</div>
    </div>

    <!-- Bục TOP 3 -->
    <div class="podium-container" id="leaderboardPodium"></div>

    <!-- KHỐI THÀNH TÍCH CÁ NHÂN GỌN GÀNG -->
    <div id="compactUserRankContainer" class="compact-personal-rank">
        <div class="c-rank-info">
            <i class="fa-solid fa-user-astronaut"></i>
            <span id="cRankText">Thành tích của bạn:</span>
        </div>
        <div class="c-rank-stats" id="cRankStats">
            <span class="xp-badge">Đang tải...</span>
        </div>
    </div>
    
    <!-- Danh sách TOP PHÂN TRANG -->
    <div class="modern-leaderboard-list" id="leaderboardTableBody"></div>

    <!-- Nút Phân trang -->
    <div class="pagination-container" id="leaderboardPagination">
        <button id="btnPrevPage" class="page-btn" disabled><i class="fa-solid fa-chevron-left"></i> Trước</button>
        <span id="pageIndicator" class="page-indicator">Trang 1 / 1</span>
        <button id="btnNextPage" class="page-btn">Sau <i class="fa-solid fa-chevron-right"></i></button>
    </div>
</div>
