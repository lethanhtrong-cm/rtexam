<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT-quiz | Nền tảng Ôn thi Y Khoa</title>
    
    <!-- Load Tailwind V4 từ CDN (Theo đúng setup của bạn) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- CSS xử lý hiệu ứng Load Module mượt mà -->
    <style>
        .fade-in-module {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden selection:bg-teal-200 selection:text-teal-900">

    <!-- Điều hướng Navbar -->
    <div data-component="components/navbar.html" class="sticky top-0 z-50"></div>

    <main id="main-content" class="flex flex-col pt-8 lg:pt-16 pb-0">
        
        <!-- Slide 1: Hero Cover & Tính năng chung -->
        <div data-component="components/hero-slide-1.html"></div>
        
        <!-- Divider phân cách nhẹ -->
        <div class="max-w-6xl mx-auto w-full px-6 py-4">
            <hr class="border-slate-200/60">
        </div>

        <!-- Slide 2: Lộ trình cá nhân hóa & Biểu đồ -->
        <div data-component="components/hero-slide-2.html"></div>

        <!-- Slide 3: Thi đấu giao hữu & Giám thị -->
        <div data-component="components/hero-slide-3.html"></div>

        <!-- Các tính năng khác (Features) -->
        <div data-component="components/features.html"></div>

    </main>

    <!-- Chân trang Footer -->
    <div data-component="components/footer.html"></div>

    <script src="js/main.js"></script>
</body>
</html>
