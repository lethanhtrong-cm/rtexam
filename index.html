<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RT-quiz | Nền tảng Ôn thi Y Khoa</title>
    
    <!-- Load Tailwind V4 từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- CSS xử lý hiệu ứng Load Module mượt mà -->
    <style>
        .fade-in-module {
            animation: fadeIn 0.5s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-x-hidden selection:bg-teal-200 selection:text-teal-900">

    <!-- Thanh Điều hướng (Navbar) -->
    <div data-component="intro/components/navbar.html" class="sticky top-0 z-50 shadow-sm"></div>

    <main id="main-content" class="flex flex-col pt-8 lg:pt-12 pb-0">
        
        <!-- MODULE 1: Split-Screen Hero & Auth (Giao diện chia đôi) -->
        <div data-component="intro/components/hero-slide-1.html"></div>
        
        <!-- Divider phân cách nhẹ nhàng -->
        <div class="max-w-6xl mx-auto w-full px-6 py-6">
            <hr class="border-slate-200/60">
        </div>

        <!-- MODULE 2: Lộ trình & Biểu đồ -->
        <div data-component="intro/components/hero-slide-2.html"></div>

        <!-- MODULE 3: Thi đấu & Giám thị -->
        <div data-component="intro/components/hero-slide-3.html"></div>

        <!-- MODULE 4: Tính năng khác -->
        <div data-component="intro/components/features.html"></div>

    </main>

    <!-- Chân trang (Footer) -->
    <div data-component="intro/components/footer.html"></div>

    <!-- Script trung tâm: Vừa nạp HTML động, vừa chứa Logic Đăng nhập Firebase -->
    <script type="module" src="intro/js/main.js"></script>
</body>
</html>
