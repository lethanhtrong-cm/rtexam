<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chờ (Lobby) - Hệ Thống Thi Trắc Nghiệm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #4b0082, #2c3e50);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffdf00;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }
        .user-info i {
            font-size: 1.2rem;
            color: #00ff88;
        }
        
        /* ---------------- STATE 1: PHÒNG CHỜ ---------------- */
        #state1Waiting {
            display: block; 
            flex: 1;
        }
        .center-area {
            text-align: center;
            padding: 30px 20px 15px 20px;
            animation: bounceIn 1s ease;
        }
        .room-label {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            color: #b3a2c7;
        }
        .room-code {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: white;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .exam-name {
            font-size: 1.6rem;
            font-weight: 700;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.1);
            padding: 10px 25px;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid rgba(0, 229, 255, 0.3);
            max-width: 90%;
            word-wrap: break-word;
        }

        /* Host Control Panel */
        .host-panel {
            background: rgba(255, 255, 255, 0.15);
            border: 2px dashed #ffdf00;
            border-radius: 20px;
            max-width: 800px;
            margin: 15px auto;
            padding: 20px;
            width: calc(100% - 40px);
            display: none;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            animation: fadeIn 0.5s ease;
        }
        .host-panel-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: #ffdf00;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .host-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }
        .host-select {
            flex: 1;
            min-width: 280px;
            padding: 12px 15px;
            font-size: 1rem;
            font-family: inherit;
            font-weight: 700;
            border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.2);
            background: #2c3e50;
            color: white;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }
        .host-select:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 10px rgba(0,229,255,0.5);
        }
        .btn-panel {
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            color: white;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
        }
        .btn-panel:active {
            transform: translateY(4px);
            box-shadow: none;
        }
        .btn-invite-friend { background: #9b59b6; }
        .btn-invite-friend:hover { background: #8e44ad; }
        .btn-copy-link { background: #34495e; border: 1px solid rgba(255,255,255,0.2); }
        .btn-copy-link:hover { background: #2c3e50; }

        /* Grid: Participants */
        .participants-container {
            flex: 1;
            padding: 20px 40px 120px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .participants-count {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 700;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 25px;
            justify-items: center;
        }
        .participant-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 15px;
            border-radius: 18px;
            text-align: center;
            width: 100%;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
            animation: popIn 0.5s ease forwards;
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .participant-card:hover {
            transform: scale(1.08);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .participant-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #ffdf00;
            margin-bottom: 10px;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .participant-name {
            font-size: 1rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .grid-badge {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .grid-badge-playing { background: #3498db; color: white; }
        .grid-badge-finished { background: #2ecc71; color: white; }
        .grid-badge-waiting { background: #95a5a6; color: white; }

        /* Footer Action */
        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 22px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            text-align: center;
            border-top: 2px solid rgba(255,255,255,0.1);
            z-index: 99;
        }
        .btn-start {
            background: #00e676;
            color: #000;
            font-size: 1.6rem;
            font-weight: 900;
            padding: 14px 60px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 8px 0 #00b25c;
            transition: all 0.1s;
            display: none;
            margin: 0 auto;
        }
        .btn-start:disabled {
            background: #78909c !important;
            box-shadow: 0 8px 0 #455a64 !important;
            color: #b0bec5 !important;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-start:active:not(:disabled) {
            transform: translateY(8px);
            box-shadow: none;
        }
        .waiting-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #b3a2c7;
            animation: pulse 1.5s infinite;
        }

        /* ---------------- STATE 2: LEADERBOARD ---------------- */
        #state2Leaderboard {
            display: none; 
            flex: 1;
            padding: 40px 20px 100px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }
        .leaderboard-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .leaderboard-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: #ffdf00;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .leaderboard-subtitle {
            font-size: 1.2rem;
            color: #00e5ff;
        }
        .table-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .lb-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        .lb-table th {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 900;
            text-transform: uppercase;
            color: #b3a2c7;
        }
        .lb-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
            font-size: 1.1rem;
            font-weight: 700;
        }
        .lb-table tr:last-child td { border-bottom: none; }
        .lb-table tbody tr:hover { background: rgba(255,255,255,0.05); }
        .td-user {
            display: flex;
            align-items: center;
            gap: 15px;
            justify-content: flex-start;
            padding-left: 30px !important;
        }
        .td-user img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ffdf00;
            object-fit: cover;
        }
        /* Status Badges */
        .badge {
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
        }
        .badge-waiting { background: #95a5a6; color: white; }
        .badge-playing { background: #3498db; color: white; box-shadow: 0 0 10px rgba(52,152,219,0.5); animation: pulse 1.5s infinite; }
        .badge-finished { background: #2ecc71; color: white; }

        /* Action Buttons */
        .btn-end-room {
            background: #e74c3c;
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #c0392b;
            transition: all 0.2s;
            display: block;
            margin: 30px auto 15px auto;
        }
        .btn-end-room:active { transform: translateY(6px); box-shadow: none; }
        
        .btn-secondary {
            background: #7f8c8d;
            color: white;
            font-size: 1.2rem;
            font-weight: 900;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 #576574;
            transition: all 0.2s;
            display: block;
            margin: 15px auto 0 auto;
        }
        .btn-secondary:active { transform: translateY(6px); box-shadow: none; }

        /* Modal Mời Bạn Bè */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: all 0.3s ease; z-index: 999;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: #2c3e50; border: 3px solid #9b59b6; border-radius: 20px;
            padding: 30px; width: 90%; max-width: 450px; text-align: center;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5); transform: translateY(-30px);
            transition: all 0.3s ease; color: white;
        }
        .modal.active .modal-content { transform: translateY(0); }
        .modal-title { font-size: 1.5rem; font-weight: 900; color: #9b59b6; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .modal-input {
            width: 100%; padding: 12px 15px; font-size: 1rem; border-radius: 10px; border: 2px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.2); color: white; outline: none; margin-bottom: 20px; font-family: inherit; text-align: center;
        }
        .modal-input:focus { border-color: #9b59b6; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-modal-submit { background: #9b59b6; color: white; border: none; padding: 12px 25px; font-weight: 700; border-radius: 10px; cursor: pointer; font-family: inherit; }
        .btn-modal-close { background: #7f8c8d; color: white; border: none; padding: 12px 25px; font-weight: 700; border-radius: 10px; cursor: pointer; font-family: inherit; }

        /* Animations */
        @keyframes bounceIn { 0% { transform: scale(0.8); opacity: 0; } 50% { transform: scale(1.03); } 100% { transform: scale(1); opacity: 1; } }
        @keyframes popIn { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="logo">QuizApp</div>
        <div class="user-info">
            <i class="fa-solid fa-user-astronaut"></i>
            <span id="headerUserName">Đang tải...</span>
        </div>
    </header>

    <div id="state1Waiting">
        <div class="center-area">
            <div class="room-label">Mã Phòng Tham Gia</div>
            <div class="room-code" id="displayRoomId">------</div>
            <div class="exam-name" id="displayExamName"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải thông tin...</div>
        </div>

        <div class="host-panel" id="hostPanel">
            <div class="host-panel-title"><i class="fa-solid fa-crown"></i> Bảng điều khiển của chủ phòng</div>
            <div class="host-controls">
                <select class="host-select" id="selectExamInLobby">
                    <option value="">-- Đang tải bộ đề từ hệ thống... --</option>
                </select>
                <button class="btn-panel btn-invite-friend" id="btnOpenInviteModal">
                    <i class="fa-solid fa-user-plus"></i> Mời bạn bè
                </button>
                <button class="btn-panel btn-copy-link" id="btnCopyLink">
                    <i class="fa-solid fa-copy"></i> Sao chép Link
                </button>
            </div>
        </div>

        <div class="participants-container">
            <div class="participants-count">Người chơi trong phòng: <span id="playerCount">0</span></div>
            <div class="grid" id="participantsGrid">
                </div>
        </div>

        <div class="footer-action">
            <button id="btnStart" class="btn-start" disabled><i class="fa-solid fa-rocket"></i> BẮT ĐẦU THI</button>
            <div id="waitingText" class="waiting-text">Đang chờ chủ phòng cấu hình bài thi...</div>
        </div>
    </div>

    <div id="state2Leaderboard">
        <div class="leaderboard-header">
            <div class="leaderboard-title" id="lbMainTitle"><i class="fa-solid fa-trophy"></i> Bảng Xếp Hạng Trực Tiếp</div>
            <div class="leaderboard-subtitle" id="lbSubTitle">Tiến độ làm bài của các thành viên</div>
        </div>

        <div class="table-container">
            <table class="lb-table">
                <thead>
                    <tr>
                        <th style="text-align: left; padding-left: 30px;">Học viên</th>
                        <th>Trạng thái</th>
                        <th>Điểm số</th>
                        <th>Thời gian</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    </tbody>
            </table>
        </div>

        <button id="btnEndRoom" class="btn-end-room" style="display: none;"><i class="fa-solid fa-flag-checkered"></i> KẾT THÚC PHÒNG THI</button>
        <button id="btnBackToLobby" class="btn-secondary"><i class="fa-solid fa-arrow-left"></i> QUAY LẠI PHÒNG CHỜ</button>
    </div>

    <div class="modal" id="inviteFriendModal">
        <div class="modal-content">
            <div class="modal-title"><i class="fa-solid fa-envelope"></i> Mời Bạn Bè Tham Gia</div>
            <input type="email" class="modal-input" id="inviteEmailInput" placeholder="Nhập email của bạn bè...">
            <div class="modal-actions">
                <button class="btn-modal-submit" id="btnSendInvite">Gửi lời mời ngay</button>
                <button class="btn-modal-close" id="closeInviteModalBtn">Đóng</button>
            </div>
        </div>
    </div>

    <script type="module" src="dashboard-core.js"></script>
    <script type="module" src="lobby.js"></script>
</body>
</html>
