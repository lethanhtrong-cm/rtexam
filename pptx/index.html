<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện Bài giảng PPTX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- THANH ĐIỀU HƯỚNG TRÊN -->
    <nav class="pptx-topbar">
        <div class="topbar-left">
            <a href="../dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Về Dashboard</a>
            <h1 class="topbar-title"><i class="fa-solid fa-desktop"></i> Thư viện Bài giảng</h1>
        </div>
        <div class="topbar-center">
            <span class="active-category">Nhóm: MRI</span>
        </div>
        <div class="topbar-right">
            <span id="user-status-badge" class="badge badge-loading">Đang tải trạng thái...</span>
        </div>
    </nav>

    <!-- BỐ CỤC CHÍNH -->
    <div class="pptx-layout">
        <!-- CỘT TRÁI: DANH SÁCH FILE -->
        <aside class="pptx-sidebar">
            <h3 class="sidebar-title">Danh sách bài học</h3>
            <ul id="pptx-list" class="pptx-list">
                <!-- Danh sách sẽ được render bằng JS -->
            </ul>
        </aside>

        <!-- CỘT PHẢI: KHUNG TRÌNH CHIẾU -->
        <main class="pptx-main">
            <!-- Màn hình khóa dành cho tài khoản Free -->
            <div id="premium-lock-overlay" class="lock-overlay" style="display: flex;">
                <div class="lock-content">
                    <i class="fa-solid fa-lock" style="font-size: 3rem; color: #f59e0b; margin-bottom: 15px;"></i>
                    <h2>Nội dung Dành riêng cho Thành viên VIP</h2>
                    <p>Bạn cần nâng cấp gói <strong>PLUS</strong> hoặc <strong>PRO</strong> để xem các bài giảng PPTX chuyên sâu.</p>
                    <button onclick="window.location.href='../dashboard.html'" class="btn-upgrade">Nâng cấp ngay</button>
                </div>
            </div>

            <!-- Khung iframe nhúng file -->
            <div id="iframe-container" class="iframe-container" style="display: none;">
                <!-- Lớp bản quyền Overlay -->
                <div class="copyright-watermark"></div>
                <iframe id="pptx-viewer" src="" frameborder="0" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
            </div>
        </main>
    </div>

    <!-- Script ES6 -->
    <script type="module" src="app.js"></script>
</body>
</html>
