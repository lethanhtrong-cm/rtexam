<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Chờ (Lobby) - Hệ Thống Thi Trắc Nghiệm</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #4b0082, #2c3e50);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            color: #ffdf00;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }
        .user-info i {
            font-size: 1.2rem;
            color: #00ff88;
        }
        /* Center Area: Room Code & Exam Name */
        .center-area {
            text-align: center;
            padding: 40px 20px;
            animation: bounceIn 1s ease;
        }
        .room-label {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            color: #b3a2c7;
        }
        .room-code {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: 8px;
            color: white;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.3);
            margin-bottom: 15px;
        }
        .exam-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.1);
            padding: 10px 25px;
            border-radius: 50px;
            display: inline-block;
            border: 2px solid rgba(0, 229, 255, 0.3);
        }
        /* Grid: Participants */
        .participants-container {
            flex: 1;
            padding: 0 40px 100px 40px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .participants-count {
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            justify-items: center;
        }
        .participant-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            width: 100%;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: popIn 0.5s ease forwards;
        }
        .participant-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.2);
        }
        .participant-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #ffdf00;
            margin-bottom: 10px;
            object-fit: cover;
        }
        .participant-name {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Footer Area */
        .footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .btn-start {
            background: #00e676;
            color: #000;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 8px 0 #00b25c;
            transition: all 0.2s;
            display: none; /* Ẩn mặc định */
            margin: 0 auto;
        }
        .btn-start:active {
            transform: translateY(8px);
            box-shadow: none;
        }
        .waiting-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #b3a2c7;
            animation: pulse 1.5s infinite;
        }

        /* Animations */
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">QuizApp</div>
        <div class="user-info">
            <i class="fa-solid fa-user-astronaut"></i>
            <span id="headerUserName">Đang tải...</span>
        </div>
    </header>

    <div class="center-area">
        <div class="room-label">Mã Phòng Tham Gia</div>
        <div class="room-code" id="displayRoomId">------</div>
        <div class="exam-name" id="displayExamName"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải thông tin...</div>
    </div>

    <div class="participants-container">
        <div class="participants-count">Người chơi: <span id="playerCount">0</span></div>
        <div class="grid" id="participantsGrid">
            </div>
    </div>

    <div class="footer-action">
        <button id="btnStart" class="btn-start"><i class="fa-solid fa-rocket"></i> BẮT ĐẦU THI</button>
        <div id="waitingText" class="waiting-text">Đang chờ chủ phòng bắt đầu...</div>
    </div>

    <script type="module" src="dashboard-core.js"></script>
    <script type="module" src="lobby.js"></script>
</body>
</html>
